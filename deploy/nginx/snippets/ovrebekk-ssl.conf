# Reference copy of /etc/nginx/snippets/ovrebekk-ssl.conf (already on the server).
ssl_certificate     /etc/letsencrypt/live/ovrebekk.no/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/ovrebekk.no/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
